# Docker Compose para produção
# Ambiente prod do coletanea-digital - conecta-se ao coldigom-prod via rede compartilhada
#
# As variáveis (POSTGRES_USER, POSTGRES_PASSWORD, etc.) vêm do env_file (backend/.env.prod).
# NÃO são duplicadas na seção environment para evitar que defaults do host sobrescrevam o env_file.
# A exceção é DATABASE_URL que precisa do hostname "db" (nome do container) em vez de "localhost".

services:
  db:
    image: postgres:15-alpine
    container_name: coletanea_db_prod
    env_file:
      - backend/.env.prod
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coletanea_user} -d $${POSTGRES_DB:-coletanea_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coldigom-coletanea-prod-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=prod
    container_name: coletanea_api_prod
    env_file:
      - backend/.env.prod
    ports:
      - "${API_PORT:-8001}:8001"
    environment:
      # Sobrescreve DATABASE_URL para usar hostname "db" (rede Docker) em vez de localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER:-coletanea_user}:${POSTGRES_PASSWORD:-coletanea_prod_2026}@db:5432/${POSTGRES_DB:-coletanea_db}
      - ENVIRONMENT=prod
    depends_on:
      db:
        condition: service_healthy
    command: sh scripts/wait-for-db.sh db sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    networks:
      - coldigom-coletanea-prod-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_prod:

networks:
  coldigom-coletanea-prod-network:
    external: true
