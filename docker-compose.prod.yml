# Docker Compose para produção
# Ambiente prod do coletanea-digital - conecta-se ao coldigom-prod via rede compartilhada

services:
  db:
    image: postgres:15-alpine
    container_name: coletanea_db_prod
    env_file:
      - backend/.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coletanea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coletanea_password}
      POSTGRES_DB: ${POSTGRES_DB:-coletanea_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coletanea_user} -d ${POSTGRES_DB:-coletanea_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coldigom-coletanea-prod-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=prod
    container_name: coletanea_api_prod
    env_file:
      - backend/.env.prod
    ports:
      - "${API_PORT:-8001}:8001"
    environment:
      - ENVIRONMENT=prod
      - DATABASE_URL=postgresql://${POSTGRES_USER:-coletanea_user}:${POSTGRES_PASSWORD:-coletanea_password}@db:5432/${POSTGRES_DB:-coletanea_db}
      - POSTGRES_USER=${POSTGRES_USER:-coletanea_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-coletanea_password}
      - POSTGRES_DB=${POSTGRES_DB:-coletanea_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    command: sh scripts/wait-for-db.sh db sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    networks:
      - coldigom-coletanea-prod-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_prod:


networks:
  coldigom-coletanea-prod-network:
    external: true
